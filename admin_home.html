<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - S&A Collection</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .admin-btn {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 15px auto;
      padding: 15px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .admin-btn:hover {
      background-color: #0056b3;
    }
  </style>
  <link rel="icon" type="image/png" href="/logo/s%20and%20s%20collection%20logo.png" />
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
    <p>Welcome, Admin. Choose your task 👇</p>
  </header>

  <div class="container">
    <a href="admin_productUpload.html" class="admin-btn">📤 Upload New Product</a>
    <a href="admin_product.html" class="admin-btn">🛠️ Manage Products</a>
    <a href="admin_productRrequest.html" class="admin-btn">📬 Product Requests</a>
    <a href="admin_orders.html" class="admin-btn">📦 View Orders</a>
    <a href="admin_categories.html" class="admin-btn">📚 Manage Categories</a> <!-- Added link -->
    <a href="admin_login.html" class="admin-btn" onclick="logout()">🚪 Logout</a>
  </div>

  <script>
    function logout() {
      localStorage.removeItem("token");
      alert("Logged out successfully.");
    }
  </script>
</body>
</html>
