<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S&S Collection</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
    }
    header {
      background-color: #ff6b6b;
      color: white;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
   .navigate{
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-around;
   }
   .navigate a {
     color: white;
     text-decoration: none;
     padding: 5px 10px;
     border-radius: 5px;
     transition: background-color 0.3s;
   }
   .navigate a:hover {
     background-color: #ff4040;
   }
    .browse-all {
      text-align: center;
      margin: 20px 0;
    }
    .browse-all a {
      background-color: white;
      color: #ff6b6b;
      border: 2px solid #ff6b6b;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s ease;
    }
    .browse-all a:hover {
      background-color: #ff6b6b;
      color: white;
    }
    .showcase-title {
      text-align: center;
      font-size: 2em;
      color: #333;
      margin-top: 40px;
      margin-bottom: 20px;
    }
    .showcase {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
      animation: fadeInUp 0.6s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: scale(1.03);
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .card-content {
      padding: 20px;
      flex-grow: 1; /* Makes content fill available space */
      display: flex;
      flex-direction: column;
    }
    .card-content h3 {
      margin: 0 0 10px 0;
      font-size: 20px;
    }
    .card-content p {
      font-size: 14px;
      color: #555;
      flex-grow: 1; /* Pushes the button to the bottom */
    }
    .card-content a {
      display: inline-block;
      margin-top: 15px;
      background-color: #ff6b6b;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.2s ease;
    }
    .card-content a:hover {
      background-color: #ff4040;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to S&S collection</h1>
    <p>Explore our most popular and trending products</p>
    <div class="navigate">
      <a href="/">Home</a>
      <a href="/about.html">About us</a>
      <a href="/contact.html">Contact</a>
    </div>
  </header>

  <div class="browse-all">
    <a href="products.html">Browse All Products 🛍️</a>
  </div>

  <h2 class="showcase-title">Featured Products</h2>

  <!-- This section will be filled with products from our database -->
  <section class="showcase" id="productShowcase">
    <!-- Products will be loaded here by JavaScript -->
  </section>

  <script>
    // This function runs when the page has finished loading
    document.addEventListener('DOMContentLoaded', () => {
      fetchRandomProducts();
    });

    // This function fetches data from our new backend route
    function fetchRandomProducts() {
      // The URL must match the route we created in the backend
      const apiUrl = '/api/products/random';
      const showcase = document.getElementById('productShowcase');

      fetch(apiUrl)
        .then(response => {
          // Check if the request was successful
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.json(); // Convert the response to JSON
        })
        .then(products => {
          // Clear any existing content
          showcase.innerHTML = ''; 
          
          // If no products are found, show a message
          if (products.length === 0) {
            showcase.innerHTML = '<p>No products to display at the moment. Please check back later!</p>';
            return;
          }

          // Loop through each product and create a card for it
          products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // NOTE: You'll need to use your actual product properties here.
            // I am assuming your product has: name, description, image_url, and id
            card.innerHTML = `
              <img src="${product.image_url || 'https://via.placeholder.com/300x180?text=No+Image'}" alt="${product.name}">
              <div class="card-content">
                <h3>${product.name}</h3>
                <p>${product.description}</p>
                <a href="/product.html?id=${product.id}">View Details</a>
              </div>
            `;
            showcase.appendChild(card);
          });
        })
        .catch(error => {
          // If there's an error (e.g., backend is down), display a message
          console.error('There was a problem fetching products:', error);
          showcase.innerHTML = '<p>Sorry, we could not load products at this time.</p>';
        });
    }
  </script>
</body>
</html>
