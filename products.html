
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Products - Anty Sa'a Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    header {
      background-color: #ff6b6b;
      color: white;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .cart-icon {
      position: relative;
      font-size: 24px;
      margin-right: 20px;
      cursor: pointer;
      animation: wiggle 1s infinite;
    }

    .cart-count {
      position: absolute;
      top: -10px;
      right: -10px;
      background-color: white;
      color: #ff6b6b;
      border-radius: 50%;
      padding: 3px 6px;
      font-size: 12px;
      font-weight: bold;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(5deg); }
      50% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px auto;
      max-width: 1200px;
    }

    select {
      padding: 10px;
      border-radius: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .product-card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .product-card:hover {
      transform: scale(1.02);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin: 0;
      font-size: 18px;
    }

    .product-info p {
      margin: 5px 0;
      color: #555;
    }

    .buy-button {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .buy-button:hover {
      background-color: #ff4040;
    }
  </style>
</head>
<body>
  <header>
    <h1>Browse All Products</h1>
    <div class="cart-icon" onclick="goToCart()">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </div>
  </header>

  <div class="filters">
    <select id="category">
      <option value="">All Categories</option>
      <option value="1">Fashion</option>
      <option value="2">Electronics</option>
      <option value="3">Beauty</option>
    </select>

    <select id="sort">
      <option value="newest">Newest</option>
      <option value="price">Price</option>
      <option value="name">Name</option>
    </select>
  </div>

  <section class="product-grid" id="productGrid">
    <!-- Products will be inserted here -->
  </section>

  <script>
    async function fetchProducts() {
      const category = document.getElementById('category').value;
      const sort = document.getElementById('sort').value;

      let url = `http://127.0.0.1:8000/products?`;
      if (category) url += `category_id=${category}&`;
      if (sort) url += `sort_by=${sort}`;

      const res = await fetch(url);
      const products = await res.json();

      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${product.image_url || 'https://via.placeholder.com/300x180'}" alt="${product.name}" />
          <div class="product-info">
            <h3>${product.name}</h3>
            <p>₦${product.price}</p>
            <button class="buy-button" onclick='addToCart(${JSON.stringify(product)})'>Add to Cart</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function addToCart(product) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push(product);
      localStorage.setItem('cart', JSON.stringify(cart));
      alert('Added to cart!');
      updateCartCount();
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      document.getElementById('cartCount').innerText = cart.length;
    }

    function goToCart() {
      window.location.href = 'cart.html';
    }

    document.getElementById('category').addEventListener('change', fetchProducts);
    document.getElementById('sort').addEventListener('change', fetchProducts);

    fetchProducts();
    updateCartCount();
  </script>
</body>
</html>
