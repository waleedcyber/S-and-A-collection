<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Requested Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .content {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #eee;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
    <p>Product Requests</p>
  </header>

  <div class="content">
    <div id="message" class="message">Loading requests...</div>
    <table style="display:none;">
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Requested By (Email)</th>
          <th>Quantity</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody id="requests-table-body">
      </tbody>
    </table>
  </div>

  <script>
    // Change this depending on environment
    //const baseUrl = "http://127.0.0.1:8000/api";
    //const baseUrl = "https://s-and-s-collection.onrender.com/api";
    const baseUrl = "http://127.0.0.1:8000/api";

    window.onload = async function () {
      const token = localStorage.getItem("token");
      const messageDiv = document.getElementById("message");
      const table = document.querySelector("table");

      // This check is good. It prevents the code from running without a token.
      if (!token) {
        alert("Access denied. Please log in first.");
        window.location.href = "admin_login.html";
        return;
      }

      try {
        // Here is the changed line:
        // We now use the 'baseUrl' and the correct API path.
        const res = await fetch(`${baseUrl}/admin/product-requests`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (!res.ok) {
          // This will catch errors if the token is invalid or expired
          throw new Error("Token invalid or expired");
        }

        const data = await res.json();
        const tbody = document.getElementById("requests-table-body");

        if (data.length === 0) {
          messageDiv.textContent = "No product requests found.";
        } else {
          messageDiv.style.display = "none";
          table.style.display = "table";

          data.forEach(request => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${request.product_name}</td>
              <td>${request.email}</td>
              <td>${request.quantity}</td>
              <td>${request.message}</td>
            `;
            tbody.appendChild(row);
          });
        }
      } catch (error) {
        // This 'catch' block will handle the expired token error
        alert("Session expired or unauthorized. Please log in again.");
        localStorage.removeItem("token");
        window.location.href = "admin_login.html";
      }
    };
  </script>
</body>
</html>
