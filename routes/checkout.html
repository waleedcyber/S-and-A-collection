<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout - S&A Collection</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f7f7f7;
      padding: 30px;
    }
    .checkout-container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .cart-summary {
      background: #f0f0f0;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="checkout-container">
    <h2>Checkout</h2>

    <div class="cart-summary" id="cart-summary">
      <!-- Cart items and total will show here -->
    </div>

    <form id="checkout-form">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <textarea id="address" placeholder="Delivery Address (optional)"></textarea>
      <button type="submit">Place Order</button>
    </form>

    <p id="message" style="text-align:center;"></p>
  </div>

  <script>
    const cartSummary = document.getElementById("cart-summary");
    const checkoutForm = document.getElementById("checkout-form");
    const message = document.getElementById("message");

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
      cartSummary.innerHTML = "<p>Your cart is empty.</p>";
      checkoutForm.style.display = "none";
    } else {
      let total = 0;
      let itemList = "<ul>";
      cart.forEach(item => {
        total += item.price * item.quantity;
        itemList += `<li>${item.name} x ${item.quantity} - ₦${item.price * item.quantity}</li>`;
      });
      itemList += "</ul>";
      cartSummary.innerHTML = itemList + `<strong>Total: ₦${total}</strong>`;
    }

    checkoutForm.addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        address: document.getElementById("address").value,
        total: cart.reduce((acc, item) => acc + (item.price * item.quantity), 0),
        items: cart
      };

      try {
        const res = await fetch("http://127.0.0.1:8000/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
          message.innerHTML = "✅ Order placed! Order ID: <b>" + result.order_id + "</b>";
          localStorage.removeItem("cart");
          checkoutForm.reset();
        } else {
          message.innerText = "❌ Error: " + result.detail || "Unknown error";
        }
      } catch (err) {
        message.innerText = "❌ Network error. Try again.";
      }
    });
  </script>
</body>
</html>
