<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo/s%20and%20s%20collection%20logo.png" />
  <title>Admin - Upload Product</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }
  </style>

  <script>
    // 🔒 Check token immediately when page loads
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Access denied. Please log in first.");
      window.location.href = "admin_login.html"; // 👈 change if your login page has another name
    }
  </script>
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
    <p>Upload New Product</p>
  </header>

  <div class="form-container">
    <h2>Add Product</h2>
    <form id="productForm">
      <input type="text" name="name" placeholder="Product Name" required>
      <input type="number" name="price" placeholder="Price (₦)" required>
      <select name="category_id" id="categorySelect" required>
        <option value="">-- Select Category --</option>
      </select>
      <textarea name="description" rows="4" placeholder="Product Description"></textarea>
      <input type="file" name="image" accept="image/*" required />
      <input type="number" name="quantity" placeholder="Quantity" required>
      <button type="submit">Upload Product</button>
    </form>
    <p id="responseMsg"></p>
  </div>

  <script>
  // Replaced previous base: window.__API_BASE__ || '/api'
  // Now using production API base
  const baseUrl = "https://s-and-s-collection-32bh.onrender.com/api"; // previously: window.__API_BASE__ || '/api'

    // When form is submitted
    document.getElementById("productForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const formData = new FormData(this);
      const res = await fetch(`${baseUrl}/admin/upload`, {   // 👈 switched to /upload
        method: "POST",
        headers: {
          Authorization: `Bearer ${localStorage.getItem("token")}`
        },
        body: formData
      });

      const msg = document.getElementById("responseMsg");
      if (res.ok) {
        msg.style.color = "green";
        msg.textContent = "Product uploaded successfully!";
        this.reset();
      } else {
        const data = await res.json();
        msg.style.color = "red";
        msg.textContent = data.detail || "Upload failed.";
      }
    });

    // Fetch categories
    async function fetchCategories() {
      const res = await fetch(`${baseUrl}/admin/categories`, {
        headers: { Authorization: `Bearer ${localStorage.getItem("token")}` }
      });

      if (res.ok) {
        const categories = await res.json();
        const select = document.getElementById("categorySelect");
        select.innerHTML = `<option value="">-- Select Category --</option>`;
        categories.forEach(cat => {
          const option = document.createElement("option");
          option.value = cat.id;
          option.textContent = cat.name;
          select.appendChild(option);
        });
      }
    }

    fetchCategories();
  </script>
</body>
</html>
