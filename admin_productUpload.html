<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo/s%20and%20s%20collection%20logo.png" />
  <title>Admin - Upload Product</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }
  </style>

<script>
document.addEventListener("DOMContentLoaded", function() {

  const token = localStorage.getItem("token");
  if (!token) {
    alert("Access denied. Please log in first.");
    window.location.href = "admin_login.html";
  }

  const baseUrl = "https://s-and-s-collection-32bh.onrender.com/api";

  async function fetchCategories() {
    const res = await fetch(`${baseUrl}/admin/categories`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (res.ok) {
      const categories = await res.json();
      const container = document.getElementById("categoryCheckboxes");
      container.innerHTML = "";
      categories.forEach(cat => {
        container.innerHTML += `
          <label style="display:flex; align-items:center; gap:10px; padding:6px 0; font-size:16px; cursor:pointer;">
            <input type="checkbox" value="${cat.id}" style="width:20px; height:20px;">
            ${cat.name}
          </label>`;
      });
    }
  }

  document.getElementById("productForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    const checked = document.querySelectorAll('#categoryCheckboxes input[type=checkbox]:checked');
    const selectedIds = Array.from(checked).map(c => c.value).join(',');

    if (!selectedIds) {
      document.getElementById("responseMsg").style.color = "red";
      document.getElementById("responseMsg").textContent = "Please select at least one category.";
      return;
    }

    formData.append("category_ids", selectedIds);

    const res = await fetch(`${baseUrl}/admin/upload`, {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: formData
    });

    const msg = document.getElementById("responseMsg");
    if (res.ok) {
      msg.style.color = "green";
      msg.textContent = "Product uploaded successfully!";
      this.reset();
      document.querySelectorAll('#categoryCheckboxes input[type=checkbox]').forEach(cb => cb.checked = false);
    } else {
      const data = await res.json();
      msg.style.color = "red";
      msg.textContent = data.detail || "Upload failed.";
    }
  });

  fetchCategories();

}); // end DOMContentLoaded
</script>
</body>
</html>
