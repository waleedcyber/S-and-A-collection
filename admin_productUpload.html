<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Upload Product</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
    <p>Upload New Product</p>
  </header>

  <div class="form-container">
    <h2>Add Product</h2>
    <form id="productForm">
      <input type="text" name="name" placeholder="Product Name" required>
      <input type="number" name="price" placeholder="Price (₦)" required>
      <select name="category_id" id="categorySelect" required>
        <option value="">-- Select Category --</option>
      </select>
      <textarea name="description" rows="4" placeholder="Product Description"></textarea>
      <input type="file" name="image" accept="image/*" required />
      <input type="number" name="quantity" placeholder="Quantity" required>
      <button type="submit">Upload Product</button>
    </form>
    <p id="responseMsg"></p>
  </div>

<script>
  // Check if the user is logged in
  window.onload = async function () {
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Access denied. Please log in first.");
      window.location.href = "admin_login.html";
      return;
    }

    // Fetch categories dynamically
    try {
      const res = await fetch('/api/admin/categories', {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
      if (res.ok) {
        const categories = await res.json();
        const select = document.getElementById('categorySelect');
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.id;
          opt.textContent = cat.name;
          select.appendChild(opt);
        });
      } else {
        alert("Failed to load categories.");
      }
    } catch (err) {
      alert("Network error loading categories.");
    }
  };

  document.getElementById('productForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const form = e.target;
    const formData = new FormData();

    formData.append('name', form.name.value);
    formData.append('price', form.price.value);
    formData.append('category_id', form.category_id.value);
    formData.append('description', form.description.value);
    formData.append('quantity', form.quantity.value);

    if (form.image.files.length > 0) {
      formData.append('image', form.image.files[0]);
    }

    const token = localStorage.getItem("token");

    try {
      const res = await fetch('/api/admin/upload', {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${token}`
        },
        body: formData
      });

      const msg = document.getElementById('responseMsg');
      if (res.ok) {
        msg.style.color = 'green';
        msg.innerText = '✅ Product uploaded successfully!';
        form.reset();
      } else {
        const errorText = await res.text();
        msg.style.color = 'red';
        msg.innerText = `❌ Upload failed: ${errorText}`;
      }
    } catch (err) {
      console.error('Error uploading product:', err);
      const msg = document.getElementById('responseMsg');
      msg.style.color = 'red';
      msg.innerText = '❌ Upload failed due to network error.';
    }
  });
</script>

</body>
</html>
