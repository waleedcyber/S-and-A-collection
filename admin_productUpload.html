<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Upload Product</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
    <p>Upload New Product</p>
  </header>

  <div class="form-container">
    <h2>Add Product</h2>
    <form id="productForm">
      <input type="text" name="name" placeholder="Product Name" required>
      <input type="number" name="price" placeholder="Price (₦)" required>
      <select name="category_id" id="categorySelect" required>
        <option value="">-- Select Category --</option>
      </select>
      <textarea name="description" rows="4" placeholder="Product Description"></textarea>
      <input type="file" name="image" accept="image/*" required />
      <input type="number" name="quantity" placeholder="Quantity" required>
      <button type="submit">Upload Product</button>
    </form>
    <p id="responseMsg"></p>
  </div>

  <script>
    // Remove or comment out the baseUrl definition here
    // const baseUrl = "https://s-and-s-collection.onrender.com/api";

    window.onload = async function () {
      const token = localStorage.getItem("token");
      const messageDiv = document.getElementById("message");
      const table = document.querySelector("table");

      if (!token) {
        alert("Access denied. Please log in first.");
        window.location.href = "admin_login.html";
        return;
      }

      try {
        // CHANGED: Use a relative path, consistent with your working upload page.
        // This will resolve to https://s-and-s-collection.onrender.com/api/admin/product-requests
        const res = await fetch('/api/admin/product-requests', {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (!res.ok) {
          // This will still catch 401 Unauthorized (session expired/invalid token)
          // and other non-2xx status codes.
          throw new Error("Token invalid or expired or server error");
        }

        const data = await res.json();
        const tbody = document.getElementById("requests-table-body");

        if (data.length === 0) {
          messageDiv.textContent = "No product requests found.";
        } else {
          messageDiv.style.display = "none";
          table.style.display = "table";

          data.forEach(request => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${request.product_name}</td>
              <td>${request.email}</td>
              <td>${request.quantity}</td>
              <td>${request.message}</td>
            `;
            tbody.appendChild(row);
          });
        }
      } catch (error) {
        console.error("Error fetching product requests:", error); // Log the actual error
        alert("Session expired or unauthorized. Please log in again.");
        localStorage.removeItem("token");
        window.location.href = "admin_login.html";
      }
    };
  </script>
</body>
</html>
